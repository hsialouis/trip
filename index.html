<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<title>旅行共編手帳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d4442a'/%3E%3Cpath d='M32 12c-8 0-14 6-14 14 0 10 14 26 14 26s14-16 14-26c0-8-6-14-14-14z' fill='%23fff'/%3E%3Ccircle cx='32' cy='26' r='5' fill='%23d4442a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="top"><div class="loading">正在打開旅行手帳…</div></div>
  <section class="card mapcard" id="mapcard" hidden aria-label="地圖">
    <div id="map"></div>
    <div class="mapnote" id="mapnote" hidden></div>
    <div class="mapbar" id="mapbar">
      <span id="mapinfo"></span>
      <span style="display:flex;gap:6px">
        <button class="btn small" data-act="fit">顯示全部</button>
        <button class="btn small" data-act="locate">我的位置</button>
      </span>
    </div>
  </section>
  <div id="view"></div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <form class="panel" id="sheetform" autocomplete="off"></form>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
